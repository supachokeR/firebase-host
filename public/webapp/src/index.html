<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Member & LINE Bot Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Prompt', sans-serif; background-color: var(--bg); color: var(--text); padding: 2rem 1rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: var(--white); padding: 2rem; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 2rem; }
        h1 { text-align: center; margin-bottom: 1.5rem; color: var(--primary); }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; }
        .btn { width: 100%; padding: 0.75rem; border: none; border-radius: 0.5rem; background: var(--primary); color: white; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        .btn-danger { background: #ef4444; width: auto; padding: 0.4rem 0.8rem; }
        .btn-warning { background: #f59e0b; width: auto; padding: 0.4rem 0.8rem; margin-right: 0.5rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background: #f1f5f9; font-weight: 600; }
        .loading { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); display:none; justify-content:center; align-items:center; z-index:1000; }
        .uuid-badge { font-family: monospace; background: #f1f5f9; padding: 2px 4px; border-radius: 4px; font-size: 11px; color: #475569; }
    </style>
</head>
<body>
    <div id="loading" class="loading"><div>กำลังประมวลผล...</div></div>

    <div class="container">
        <div class="card">
            <h1 id="formTitle">จัดการสมาชิกและ LINE Bot</h1>
            <form id="memberForm">
                <input type="hidden" id="memberId">
                <input type="hidden" id="oldFileId">
                <input type="hidden" id="currentUuid">
                
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                    <div class="form-group">
                        <label>ชื่อ-นามสกุล</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label>อีเมล</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label>Keyword</label>
                        <input type="text" id="keyword" required placeholder="เช่น เมนู1">
                    </div>
                    <div class="form-group">
                        <label>ไฟล์รูปภาพ</label>
                        <input type="file" id="file" accept="image/*">
                    </div>
                </div>
                
                <button type="submit" class="btn" id="submitBtn">บันทึกข้อมูลสมาชิก</button>
                <button type="button" class="btn" id="cancelBtn" style="background:#64748b; display:none;">ยกเลิก</button>
            </form>
        </div>

        <div class="card">
            <h1>รายชื่อสมาชิกทั้งหมด</h1>
            <div style="overflow-x:auto">
                <table>
                    <thead>
                        <tr>
                            <th>UUID</th>
                            <th>ชื่อ</th>
                            <th>อีเมล</th>
                            <th>Keyword</th>
                            <th>ไฟล์</th>
                            <th>จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="memberList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = <?!= JSON.stringify(firebaseConfig) ?>;
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const form = document.getElementById('memberForm');
        const memberList = document.getElementById('memberList');
        const loading = document.getElementById('loading');
        let allData = {};

        db.ref('members').on('value', (snapshot) => {
            allData = snapshot.val();
            renderTable(allData);
        });

        function renderTable(data) {
            memberList.innerHTML = '';
            if (!data) {
                memberList.innerHTML = '<tr><td colspan="6" style="text-align:center">ไม่มีข้อมูล</td></tr>';
                return;
            }
            Object.keys(data).forEach(key => {
                const item = data[key];
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="uuid-badge">${item.uuid || '-'}</span></td>
                    <td>${item.name}</td>
                    <td>${item.email}</td>
                    <td><span style="background:#dcfce7; color:#166534; padding:2px 8px; border-radius:4px;">${item.keyword || '-'}</span></td>
                    <td>${item.fileUrl ? `<a href="${item.fileUrl}" target="_blank">ดูรูป</a>` : '-'}</td>
                    <td>
                        <button class="btn-warning" onclick="editRecord('${key}')">แก้ไข</button>
                        <button class="btn-danger" onclick="deleteRecord('${key}', '${item.fileId}')">ลบ</button>
                    </td>
                `;
                memberList.appendChild(tr);
            });
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            showLoading(true);
            
            const id = document.getElementById('memberId').value;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const keyword = document.getElementById('keyword').value;
            const file = document.getElementById('file').files[0];
            const oldFileId = document.getElementById('oldFileId').value;
            let uuid = document.getElementById('currentUuid').value;

            // Generate UUID if new record
            if (!id && !uuid) {
                try {
                    uuid = await new Promise((resolve, reject) => {
                        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getServerUuid();
                    });
                } catch (err) {
                    uuid = 'gen-' + Date.now(); // Fallback
                }
            }

            let fileInfo = { fileId: oldFileId || '', fileUrl: id && allData[id] ? allData[id].fileUrl : '' };

            if (file) {
                try {
                    const base64 = await toBase64(file);
                    fileInfo = await new Promise((resolve, reject) => {
                        google.script.run
                            .withSuccessHandler(resolve)
                            .withFailureHandler(reject)
                            .uploadFile(base64, file.name, file.type, oldFileId);
                    });
                } catch (err) {
                    Swal.fire('Error', 'อัปโหลดไม่สำเร็จ: ' + err.message, 'error');
                    showLoading(false);
                    return;
                }
            }

            const memberData = {
                uuid: uuid,
                name: name,
                email: email,
                keyword: keyword,
                fileId: fileInfo.fileId,
                fileUrl: fileInfo.fileUrl,
                updatedAt: firebase.database.ServerValue.TIMESTAMP
            };

            const targetId = id || db.ref().child('members').push().key;
            db.ref('members/' + targetId).update(memberData).then(() => {
                Swal.fire('สำเร็จ', 'บันทึกข้อมูลเรียบร้อย (UUID: ' + uuid + ')', 'success');
                form.reset();
                resetForm();
                showLoading(false);
            }).catch(err => {
                Swal.fire('Error', err.message, 'error');
                showLoading(false);
            });
        };

        function editRecord(id) {
            const item = allData[id];
            document.getElementById('memberId').value = id;
            document.getElementById('currentUuid').value = item.uuid || '';
            document.getElementById('name').value = item.name;
            document.getElementById('email').value = item.email;
            document.getElementById('keyword').value = item.keyword || '';
            document.getElementById('oldFileId').value = item.fileId || '';
            document.getElementById('formTitle').innerText = 'แก้ไขข้อมูลสมาชิก';
            document.getElementById('cancelBtn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteRecord(id, fileId) {
            Swal.fire({ title: 'ยืนยันการลบ?', icon: 'warning', showCancelButton: true }).then(res => {
                if (res.isConfirmed) {
                    showLoading(true);
                    db.ref('members/' + id).remove().then(() => {
                        if (fileId) google.script.run.deleteDriveFile(fileId);
                        showLoading(false);
                        Swal.fire('ลบแล้ว', '', 'success');
                    });
                }
            });
        }

        function resetForm() {
            document.getElementById('memberId').value = '';
            document.getElementById('oldFileId').value = '';
            document.getElementById('currentUuid').value = '';
            document.getElementById('formTitle').innerText = 'จัดการสมาชิกและ LINE Bot';
            document.getElementById('cancelBtn').style.display = 'none';
        }
        document.getElementById('cancelBtn').onclick = resetForm;

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
        function showLoading(show) { loading.style.display = show ? 'flex' : 'none'; }
    </script>
</body>
</html>
