<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกข้อมูลเบื้องต้น</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        .loader {
            border-top-color: #3498db;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @-webkit-keyframes spinner {
            0% { -webkit-transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); }
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-white">
        <div class="flex flex-col items-center">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
            <h2 class="text-center text-gray-600 text-xl font-semibold">กำลังโหลด...</h2>
            <p class="w-1/3 text-center text-gray-500">กรุณารอสักครู่ ระบบกำลังจัดเตรียมข้อมูล</p>
        </div>
    </div>

    <!-- Login Section -->
    <div id="login-section" class="hidden flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">เข้าสู่ระบบ</h1>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">อีเมล</label>
                    <input type="email" id="login-email" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="example@mail.com" required>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">รหัสผ่าน</label>
                    <input type="password" id="login-password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-300">
                    เข้าสู่ระบบ
                </button>
                <div class="text-center mt-2">
                    <button type="button" id="signup-btn" class="text-sm text-blue-500 hover:underline">ยังไม่มีบัญชี? สมัครสมาชิก</button>
                </div>
            </form>
            <div class="mt-4 text-center">
                <button id="setup-db-btn" class="text-sm text-gray-500 hover:text-blue-500">
                    <i class="fas fa-database mr-1"></i> ตั้งค่าฐานข้อมูลเริ่มต้น
                </button>
            </div>
        </div>
    </div>

    <!-- Main App Section -->
    <div id="main-section" class="hidden">
        <nav class="bg-white shadow-sm mb-8">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold text-blue-600">ระบบบันทึกข้อมูล</h1>
                <div class="flex items-center space-x-4">
                    <span id="user-display" class="text-gray-600 text-sm"></span>
                    <button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm transition">ออกจากระบบ</button>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- Form Section -->
                <div class="md:col-span-1">
                    <div class="bg-white p-6 rounded-lg shadow-md">
                        <h2 class="text-lg font-semibold mb-4 border-b pb-2" id="form-title">บันทึกข้อมูลใหม่</h2>
                        <form id="record-form" class="space-y-4">
                            <input type="hidden" id="record-id">
                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-2">ชื่อ-นามสกุล</label>
                                <input type="text" id="fullname" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                            </div>
                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-2">เบอร์โทรศัพท์</label>
                                <input type="tel" id="phone" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                            </div>
                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-2">อีเมล</label>
                                <input type="email" id="email" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                            </div>
                            <div class="flex space-x-2">
                                <button type="submit" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded transition">
                                    บันทึก
                                </button>
                                <button type="button" id="cancel-btn" class="hidden flex-1 bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded transition">
                                    ยกเลิก
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- List Section -->
                <div class="md:col-span-2">
                    <div class="bg-white p-6 rounded-lg shadow-md">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-lg font-semibold">รายการข้อมูล</h2>
                            <div id="admin-tools" class="hidden">
                                <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2.5 py-0.5 rounded">โหมดผู้ดูแลระบบ</span>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-gray-50 border-b">
                                        <th class="py-3 px-4 font-semibold text-gray-600 uppercase text-xs">ชื่อ-นามสกุล</th>
                                        <th class="py-3 px-4 font-semibold text-gray-600 uppercase text-xs">เบอร์โทร</th>
                                        <th class="py-3 px-4 font-semibold text-gray-600 uppercase text-xs">อีเมล</th>
                                        <th class="py-3 px-4 font-semibold text-gray-600 uppercase text-xs">การจัดการ</th>
                                    </tr>
                                </thead>
                                <tbody id="records-list">
                                    <!-- Data will be injected here -->
                                </tbody>
                            </table>
                            <div id="empty-state" class="text-center py-8 text-gray-500 hidden">
                                <i class="fas fa-folder-open text-4xl mb-2"></i>
                                <p>ยังไม่มีข้อมูลในระบบ</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
